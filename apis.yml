name: Almanac Leie1
description: >-
  Almanac Labs, Inc. (almanac.io) is a San Francisco-based productivity company building an
  async collaboration platform positioned as "the fastest wiki and workflow tool ever built."
  Almanac consolidates a team's documents into an organized single source of truth, pairing a
  modern doc editor with version control, structured review/approval workflows, and reusable
  templates. Founded in 2017 and backed by General Catalyst, the company also ships the Almanac
  API (V1, private beta) for programmatic workspace management — importing files, moving files
  and folders, listing workspace users and groups, reading and updating document properties and
  access, and managing document and folder metadata. This profile was surfaced as a General
  Catalyst portfolio lead and enriched from Almanac's public marketing, developer help, changelog,
  and legal pages.
